name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 为已有 tag（如 v1.1.0）编译并发布 Release；留空则只编译所选分支
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: true

jobs:
  build:
    name: 编译与测试
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: 编译、单元测试、截图对比、Lint、发布包
        run: ./gradlew assembleDebug testDebugUnitTest verifyPaparazziDebug lintDebug assembleRelease --console=plain

      - name: 上传调试 APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: 上传未签名发布 APK
        uses: actions/upload-artifact@v7
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk

      - name: 上传测试与 Lint 报告
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports
            app/build/test-results

  release:
    name: 签名并发布
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # The signing script and CHANGELOG come from the default branch, so older tags can be
      # released too.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/download-artifact@v8
        with:
          name: app-release-unsigned
          path: dist

      - name: 签名
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::缺少签名密钥 Secrets（RELEASE_KEYSTORE_BASE64 等），见 README“发布”一节"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          RELEASE_KEYSTORE_FILE="$RUNNER_TEMP/release.jks" \
            scripts/sign-apk.sh dist/app-release-unsigned.apk "dist/interval-timer-$TAG.apk" | tee "$RUNNER_TEMP/cert.txt"
          (cd dist && sha256sum "interval-timer-$TAG.apk" > "interval-timer-$TAG.apk.sha256")

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=("dist/interval-timer-$TAG.apk" "dist/interval-timer-$TAG.apk.sha256")
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            exit 0
          fi
          # Release notes: the "## [x.y.z]" section of CHANGELOG.md, plus install notes.
          awk -v ver="${TAG#v}" '/^## /{p = index($0, "[" ver "]") > 0; next} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "见 [CHANGELOG.md](CHANGELOG.md)。" > notes.md
          fingerprint=$(sed -n 's/.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/cert.txt")
          {
            echo
            echo "### 安装"
            echo
            echo "下载 \`interval-timer-$TAG.apk\` 安装。安装过调试版的设备需先卸载（签名不同）。"
            echo
            echo "签名证书 SHA-256：\`$fingerprint\`"
          } >> notes.md
          gh release create "$TAG" "${assets[@]}" --verify-tag --title "$TAG" --notes-file notes.md
